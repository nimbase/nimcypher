name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"macos-15"}]'
      pre-install-command: |
        curl -fsSL -o monocypher-4.0.2.tar.gz https://monocypher.org/download/monocypher-4.0.2.tar.gz
        tar -xzf monocypher-4.0.2.tar.gz
        cd monocypher-4.0.2
        if [ "$RUNNER_OS" = "macOS" ]; then
          # Monocypher's shared library target uses -Wl,-soname, which the
          # macOS linker does not support. Install only the static library,
          # plus the pkg-config file so pkg-config can find it.
          #
          # GitHub's macOS-15 runners are Apple Silicon, but the Nim toolchain
          # installed by setup-nim-action targets x86_64 (Rosetta). Build a
          # universal static library covering both architectures so linking
          # works for whichever architecture Nim emits.
          make static-library CC="clang -arch arm64 -std=c99" CFLAGS="-O3"
          mv lib/libmonocypher.a /tmp/libmonocypher-arm64.a
          make clean
          make static-library CC="clang -arch x86_64 -std=c99" CFLAGS="-O3"
          mv lib/libmonocypher.a /tmp/libmonocypher-x86_64.a
          lipo -create /tmp/libmonocypher-arm64.a /tmp/libmonocypher-x86_64.a \
            -output /tmp/libmonocypher.a
          sudo mkdir -p /usr/local/lib/pkgconfig /usr/local/include
          sudo cp -P /tmp/libmonocypher.a /usr/local/lib/libmonocypher.a
          sudo cp -P src/monocypher.h /usr/local/include
          sudo cp -P src/optional/monocypher-ed25519.h /usr/local/include
          sudo sh -c "sed 's|PREFIX|/usr/local|' monocypher.pc > /usr/local/lib/pkgconfig/monocypher.pc"
        else
          make
          sudo make install
        fi
      # Run the SIMD-accelerated tests (ChaCha20, AEAD, C interop) before the
      # full scalar suite.
      pre-test-command: |
        nimble test_simd